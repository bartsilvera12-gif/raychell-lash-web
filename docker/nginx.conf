server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Las fotos ya estan comprimidas; esto es para el HTML, el JS y el SVG.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript image/svg+xml;

    # Fotos y React: el nombre no cambia nunca, se pueden cachear un ano.
    # El add_header va sin "always" a proposito, para que un 404 no se
    # quede cacheado un ano en el navegador de quien lo pida.
    location /assets/ {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    location /vendor/ {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # La pagina, el runtime y el panel cambian en cada despliegue.
    #
    # Va no-store y no un max-age corto a proposito: Cloudflare reescribe el
    # Cache-Control de lo que cachea segun su "Browser Cache TTL" (4 horas por
    # defecto), asi que un max-age=0 llegaba al navegador como max-age=14400 y
    # la gente seguia viendo la version anterior durante horas. Con no-store no
    # lo cachea y la cabecera pasa intacta.
    location = /index.html {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # El panel de administracion. Va antes que el bloque de abajo para que
    # /admin no termine sirviendo la pagina publica.
    location /admin {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files  $uri $uri/ /admin/index.html;
    }

    # La navegacion es por hash, pero si alguien entra a una ruta inventada
    # igual le servimos la pagina en vez de un 404.
    location / {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files  $uri $uri/ /index.html;
    }
}
